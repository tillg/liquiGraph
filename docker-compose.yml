services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: liquigraph
      POSTGRES_USER: liquigraph
      POSTGRES_PASSWORD: liquigraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquigraph -d liquigraph"]
      interval: 1s
      timeout: 3s
      retries: 30

  liquibase:
    image: liquibase/liquibase:4.29
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${LIQUIGRAPH_CHANGELOG_DIR:-./example/changelogs}:/liquibase/changelog:ro
    command: >
      --search-path=/liquibase/changelog
      --changelog-file=${LIQUIGRAPH_MASTER_FILE:-db.changelog-master.xml}
      --url=jdbc:postgresql://postgres:5432/liquigraph
      --username=liquigraph
      --password=liquigraph
      update

  schemaspy:
    image: schemaspy/schemaspy:7.0.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${LIQUIGRAPH_OUTPUT_DIR:-./output}:/output
    command: >
      -t pgsql11
      -host postgres
      -port 5432
      -db liquigraph
      -u liquigraph
      -p liquigraph
      -s ${LIQUIGRAPH_SCHEMA:-public}
      -imageformat svg
